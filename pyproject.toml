[project]
name = "kaofusion"
version = "0.1.0"
description = "Face Swap API with FastAPI + daisyUI (vanilla JS UI)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "KaoFusion Team" }
]
dependencies = [
  # Web framework
  "fastapi>=0.115.0,<1",
  "uvicorn[standard]>=0.30.0,<1",
  "python-multipart>=0.0.7,<1",
  "pydantic>=2.9.0,<3",
  "pydantic-settings>=2.4.0,<3",
  "jinja2>=3.1.0,<4",
  "aiofiles>=24.1.0,<25",
  # Processing
  "numpy>=1.26.0,<3",
  "onnx>=1.15.0,<2",
  "onnxruntime>=1.17.0,<2",
  "opencv-python>=4.9.0,<5",
  "scipy>=1.12.0,<2",
  # Utilities
  "psutil>=5.9.0,<7",
  "tqdm>=4.66.0,<5",
  "filetype>=1.2.0,<2",
  "filelock>=3.13.0,<4",
  "huggingface-hub>=1.2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9",
  "pytest-asyncio>=0.23.0,<1",
  "httpx>=0.27.0,<1",
  "mypy>=1.8.0,<2",
  "ruff>=0.3.0,<1",
]
# GPU acceleration (install ONE of these, not multiple)
cuda = [
  "onnxruntime-gpu>=1.17.0,<2",  # NVIDIA CUDA
]
directml = [
  "onnxruntime-directml>=1.17.0,<2",  # Windows DirectML
]

[project.scripts]
kaofusion = "kaofusion.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaofusion"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
